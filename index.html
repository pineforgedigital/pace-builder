<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PACE Builder</title>
    <meta name="description" content="Offline-first disaster communication planning utility." />
    <!-- Icons (created by PWA plugin or placeholders) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- PWA Manifest will be injected by vite-plugin-pwa -->
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <header>
      <h1>PACE Builder<span class="accent-dot">.</span></h1>
      <nav>
        <a href="#" data-target="dashboard"><i data-lucide="layout-dashboard" class="tactical-icon-lg"></i> Dashboard</a>
        <a href="#" data-target="personnel"><i data-lucide="users" class="tactical-icon-lg"></i> Personnel</a>
        <a href="#" data-target="comms"><i data-lucide="radio" class="tactical-icon-lg"></i> Comms Locker</a>
        <a href="#" data-target="plans"><i data-lucide="file-text" class="tactical-icon-lg"></i> PACE Plans</a>
        <a href="#" data-target="reports"><i data-lucide="mic" class="tactical-icon-lg"></i> Reports</a>
        <a href="#" data-target="map"><i data-lucide="map" class="tactical-icon-lg"></i> Tactical Map</a>
        <a href="#" data-target="settings"><i data-lucide="settings" class="tactical-icon-lg"></i> Settings</a>
      </nav>
      <div id="network-status" class="status-online">ONLINE</div>
    </header>

    <main>
      <div id="app-content">
        <!-- Content will be injected here by router -->
      </div>
    </main>

    <!-- Global System Alert Modal -->
    <dialog id="sys-alert-modal" class="global-modal">
      <h3 id="sys-alert-title">System Alert</h3>
      <p id="sys-alert-message" style="margin-bottom: 1.5rem;"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-primary" id="sys-alert-ok">Acknowledge</button>
      </div>
    </dialog>

    <!-- Global System Confirm Modal -->
    <dialog id="sys-confirm-modal" class="global-modal">
      <h3 id="sys-confirm-title">Confirm Action</h3>
      <p id="sys-confirm-message" style="margin-bottom: 1.5rem;"></p>
      <div class="dialog-actions">
        <button type="button" class="btn cancel-btn" id="sys-confirm-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="sys-confirm-ok">Confirm</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
